skill_id: s14-operation-diagnosis
name: S14 Hotel OTA Unified Diagnosis
version: 2.0.0
description: "先选择数据库或Excel，统一生成当前23项S14 HTML报告，不区分OTA渠道。"

entrypoint:
  language: python
  file: runtime/__init__.py
  class: S14OperationDiagnosis
  method: execute

schemas:
  input: references/input_schema.json
  output: references/output_schema.json

triggers:
  file: config/triggers.yaml
  routing_doc: references/feishu_routing.md
  reply_field: feishu_card
  fallback_reply_field: feishu_message
  reply_msg_type: interactive
  initial_action: select_data_source
  source_options:
    - database
    - excel_upload
  source_state_key:
    - chat_id
    - sender_id
  source_state_ttl_seconds: 600
  attachment_requires_mention: false
  force_fresh_run: true
  forbid_memory_result: true
  forbid_previous_message_reuse: true
  report_url_cache_busting: run_id
  platform: multi
  ask_channel: false

config:
  required:
    - report_output_dir
    - public_base_url
  optional:
    - report_output_dir
    - public_base_url
    - diagnosis_project_root
    - diagnosis_python
    - source_state_file
    - source_state_ttl_seconds
  conditional_required:
    database:
      - S14_DB_DSN
    excel_upload:
      - input_excel_path
  example:
    report_output_dir: /var/lib/ota-marketing-diagnosis/reports
    public_base_url: http://47.108.200.194:8081/s14-reports
    diagnosis_project_root: /opt/openclaw/workspaces/ota-marketing-diagnosis
    source_state_file: /var/lib/hotel-ota-ai/s14-source-state.json

data_policy:
  independence: true
  controlled_source_only: true
  supported_sources:
    - database
    - excel_upload
  unified_platform: multi
  current_engine: /opt/openclaw/workspaces/ota-marketing-diagnosis
  forbid_legacy_m01_m08: true
  forbid_upstream_skill_output: true
  forbidden_input_fields:
    - metrics
    - business_fields
    - json_payload
    - manual_diagnosis_input
    - upstream_skill_output

runtime_files:
  - runtime/__init__.py
  - runtime/feishu_adapter.py
  - runtime/source_flow.py
  - runtime/router.py
  - config/triggers.yaml
  - references/input_schema.json
  - references/output_schema.json
  - references/feishu_routing.md

artifacts:
  report_file_name: report.html
  report_type: html
  output_root: /var/lib/ota-marketing-diagnosis/reports
  public_base_url: http://47.108.200.194:8081/s14-reports
  url_policy: "Return a fresh run_id report URL generated by ota-marketing-diagnosis."

safety:
  dry_run_default: true
  approval_required: false
  forbidden_actions:
    - price_write
    - inventory_write
    - promotion_write
    - review_reply_publish
