    time_grain: daily
    purpose: "Daily room price facts used for ADR evidence and price completeness."
    date_aliases: ["data_date", "biz_date", "stat_date", "日期", "营业日期"]
    hotel_aliases: ["hotel_id", "hotel_code", "酒店ID", "门店ID"]
