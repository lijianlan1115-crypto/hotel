# S14 trigger and routing contract.
# The Feishu entry first asks only for data source: database or uploaded Excel.
# The current report is a unified diagnosis and no longer asks for an OTA channel.

skill_id: s14-operation-diagnosis

trigger_policy:
  owner: config/triggers.yaml
  matching: contains_any
  case_sensitive: false
  require_hotel_id: false
  default_hotel_id: puyue
  default_platform: multi
  default_period_days: 30
  source_selection_required: true
  source_options:
    - database
    - excel
  excel_attachment_wait_seconds: 600
  note: "S14诊断先选择数据库或Excel；统一按platform=multi生成整体报告，不再询问渠道。"

trigger_phrases:
  - S14诊断
  - S14 诊断
  - S14执行
  - S14 执行
  - 运营诊断
  - OTA诊断
  - OTA全面诊断
  - 生成诊断报告
  - 查看诊断报告

input_extraction:
  required_output_fields:
    - hotel_id
    - platform
    - period_start
    - period_end
  allowed_defaults:
    hotel_id: puyue
    platform: multi
  date_patterns:
    - "\\d{4}-\\d{2}-\\d{2}"
  fallback_period:
    mode: latest_n_days
    days: 30

source_flow:
  initial_trigger_reply: source_selection_card
  database_action: run_immediately
  excel_action: wait_for_attachment
  attachment_identity:
    - chat_id
    - sender_id
  attachment_requires_mention: false
  attachment_extensions:
    - .xlsx
    - .xlsm
  state_ttl_seconds: 600

reply_policy:
  use_adapter_method: build_feishu_card_reply
  fallback_adapter_method: build_feishu_reply
  reply_field: feishu_card
  fallback_reply_field: feishu_message
  msg_type: interactive
  include_data_source: true
  bot_must_not_format_business_result: true
  force_fresh_run: true
  forbid_cached_agent_text: true
  forbid_previous_message_reuse: true
  forbidden_bot_fields:
    - final_score
    - risk_level
    - module_scores
    - caps
    - missing_fields
  note: "数据库和Excel均调用当前ota-marketing-diagnosis的23项HTML报告；飞书回复必须标明数据来源。"
